<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>clips.andties</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Jost:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#FDF3EE;--card:#ffffff;--accent:#E3A199;--ink:#B05A58;--text:color-mix(in srgb,var(--ink) 55%,#2b1b1b);--line:color-mix(in srgb,var(--accent) 40%,var(--bg));color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 'Jost',system-ui,sans-serif}
h1,h2,.serif{font-family:'Cormorant Garamond',Georgia,serif;color:var(--ink);font-weight:600;margin:0}
img{max-width:100%}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:1.5rem}
.brand img{width:40px;height:40px;border-radius:50%}
nav a{color:var(--ink);text-decoration:none;margin-left:16px;font-weight:500}
.hero{text-align:center;padding:36px 18px 20px}
.hero img{width:min(68vw,260px);border-radius:50%;box-shadow:0 10px 40px color-mix(in srgb,var(--accent) 45%,transparent)}
.hero h1{font-size:clamp(2rem,7vw,3rem);margin-top:18px}
.hero p{max-width:460px;margin:8px auto 18px;font-size:1.05rem}
.btn{display:inline-block;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 22px;font:500 15px 'Jost',sans-serif;cursor:pointer;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
main{max-width:1050px;margin:0 auto;padding:10px 16px 90px}
main h2{text-align:center;font-size:2rem;margin:18px 0 12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 16px;font:500 14px 'Jost',sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1;background:linear-gradient(135deg,var(--bg),var(--line));display:grid;place-items:center;font-size:3rem;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:10px;left:10px;background:var(--ink);color:var(--bg);font-size:12px;padding:3px 10px;border-radius:999px}
.ci{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.ci b{font:600 1.15rem 'Cormorant Garamond',Georgia,serif;color:var(--ink)}
.ci small{opacity:.8}
.price{color:var(--ink);font-weight:500}
.row{display:flex;gap:6px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.empty{text-align:center;padding:40px 10px;opacity:.8}
footer{text-align:center;padding:26px 16px 30px;border-top:1px solid var(--line)}
footer a{color:var(--ink);margin:0 10px;font-weight:500}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.08)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(40,20,20,.45);display:grid;place-items:center;padding:14px}
.panel{background:var(--card);border-radius:20px;padding:20px;width:min(480px,100%);max-height:88vh;overflow:auto}
.panel h2{font-size:1.7rem;margin-bottom:10px}
.panel label{display:block;font-size:13px;font-weight:500;margin:10px 0 3px}
.panel input[type=text],.panel textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font:400 15px 'Jost',sans-serif;background:var(--bg);color:var(--text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.cols input[type=color]{width:100%;height:38px;border:1.5px solid var(--line);border-radius:10px;background:none;padding:2px}
.pre{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.pv{width:90px;height:90px;border-radius:12px;object-fit:cover;background:var(--bg);display:block;margin-top:6px}
#cartb{position:fixed;right:14px;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;z-index:30;font-size:14px;display:none}
</style>
</head>

<script data-app="">
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ser=o=>JSON.stringify(o).replace(/</g,'\\u003c');
const LOGO=$('#logo').textContent.trim();
const saved=$('#data').textContent;
let S=JSON.parse(saved),owner=false,artifact=null,filter='All',editing=null,tmpImg='',armed=null,unlocked=false,cart={};
try{cart=JSON.parse(localStorage.getItem('cl_cart')||'{}')}catch(e){}
const svc=()=>{try{localStorage.setItem('cl_cart',JSON.stringify(cart))}catch(e){}};
const edit=()=>owner&&unlocked;
const cn=()=>S.products.reduce((a,p)=>a+(cart[p.id]||0),0);
function cartUrl(){const s=S.store,wa=s.whatsapp.replace(/\D/g,''),items=S.products.filter(p=>cart[p.id]);if(!items.length)return '';let tot=0;
 const lines=items.map(p=>{tot+=cart[p.id]*(parseFloat(p.price)||0);return cart[p.id]+' x '+p.name+' - '+s.currency+p.price});
 const msg="Hi "+s.name+"! I'd like to order:\n"+lines.join('\n')+"\nTotal: "+s.currency+tot;
 if(wa)return 'https://wa.me/'+wa+'?text='+encodeURIComponent(msg);
 if(s.insta.trim())return 'https://ig.me/m/'+encodeURIComponent(s.insta.trim().replace(/^@/,''));return '';}
function upiUrl(t,b){const s=S.store;return (b||'upi://pay')+'?pa='+encodeURIComponent(s.upi)+'&pn='+encodeURIComponent(s.name)+'&am='+t.toFixed(2)+'&cu=INR&tn='+encodeURIComponent('Order '+s.name);}
function cartForm(){const items=S.products.filter(p=>cart[p.id]);let tot=0;
 modal('<h2>Your cart</h2>'+(items.length?items.map(p=>{const q=cart[p.id];tot+=q*(parseFloat(p.price)||0);return `<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:8px 0"><span>${esc(p.name)}<br><small>${esc(S.store.currency)}${esc(p.price)}</small></span><span><button class="chip" data-act="qm" data-id="${p.id}">−</button> ${q} <button class="chip" data-act="qp" data-id="${p.id}">+</button></span></div>`}).join('')+`<p class="serif" style="font-size:1.4rem">Total: ${esc(S.store.currency)}${tot}</p>${S.store.upi?`<p style="margin:6px 0 4px"><b>Pay ${esc(S.store.currency)}${tot} using:</b></p><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${[['GPay','gpay://upi/pay'],['PhonePe','phonepe://pay'],['Paytm','paytmmp://pay'],['Other UPI','upi://pay']].map(a=>`<a class="btn sm" target="_blank" rel="noopener" href="${esc(upiUrl(tot,a[1]))}">${a[0]}</a>`).join('')}</div><p style="font-size:13px;margin:4px 0 10px">If the app doesn’t open, copy the UPI ID <b>${esc(S.store.upi)}</b> <button class="chip" data-act="cpu">Copy</button> and pay ${esc(S.store.currency)}${tot} in any UPI app.<br>After paying, tap “Order on WhatsApp” and send your payment screenshot.</p>`:''}<div class="acts"><button class="btn alt sm" data-act="close">Close</button>${cartUrl()?`<a class="btn sm" href="${cartUrl()}" target="_blank" rel="noopener">Order on WhatsApp</a>`:''}</div>`:'<p>Your cart is empty.</p><div class="acts"><button class="btn alt sm" data-act="close">Close</button></div>'));}
const PRE=[['Rose','#FDF3EE','#ffffff','#E3A199','#B05A58'],['Lavender','#F6F2FB','#ffffff','#B9A3E3','#6B4FA3'],['Sage','#F3F7F1','#ffffff','#9DBF96','#4C7448'],['Peach','#FFF4E8','#ffffff','#F4B183','#B4632F'],['Cocoa','#F7EFE9','#ffffff','#C09A84','#6B4433']];
const dirty=()=>ser(S)!==saved;
function applyTheme(){const r=document.documentElement.style;for(const k in S.theme)r.setProperty('--'+k,S.theme[k]);}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600);}
function orderUrl(p){const s=S.store,msg=`Hi ${s.name}! I'd like to order: ${p.name} (${s.currency}${p.price})`;
 if(s.whatsapp.replace(/\D/g,''))return 'https://wa.me/'+s.whatsapp.replace(/\D/g,'')+'?text='+encodeURIComponent(msg);
 if(s.insta.trim())return 'https://ig.me/m/'+encodeURIComponent(s.insta.trim().replace(/^@/,''));return '';}
function render(){
 applyTheme();document.title=S.store.name;
 const cats=['All',...new Set(S.products.map(p=>p.cat).filter(Boolean))];
 if(!cats.includes(filter))filter='All';
 const list=S.products.filter(p=>filter==='All'||p.cat===filter),s=S.store;
 const ig=s.insta.trim().replace(/^@/,''),wa=s.whatsapp.replace(/\D/g,'');
 $('#root').innerHTML=`
 <header><div class="brand serif"><img src="${LOGO}" alt=""><span>${esc(s.name)}</span></div><nav><a href="#shop">Shop</a><a href="#contact">Contact</a></nav></header>
 <section class="hero"><img src="${LOGO}" alt="${esc(s.name)} logo"><h1>${esc(s.name)}</h1><p>${esc(s.tagline)}</p><a class="btn" href="#shop">Shop now</a></section>
 <main id="shop"><h2>Our Collection</h2>
 ${cats.length>2?`<div class="chips">${cats.map(c=>`<button class="chip ${c===filter?'on':''}" data-act="filter" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}
 ${list.length?`<div class="grid">${list.map(p=>{const u=orderUrl(p);return `<div class="card"><div class="ph">${p.img?`<img src="${p.img}" alt="${esc(p.name)}" loading="lazy">`:'🎀'}${p.sold?'<span class="tag">Sold out</span>':''}</div><div class="ci"><b>${esc(p.name)}</b>${p.cat?`<small>${esc(p.cat)}</small>`:''}<span class="price">${esc(s.currency)}${esc(p.price)}</span>${p.desc?`<small>${esc(p.desc)}</small>`:''}<div class="row">${!p.sold?`<button class="btn sm" data-act="addc" data-id="${p.id}">Add to cart</button>`:''}${edit()?`<button class="btn sm alt" data-act="edit" data-id="${p.id}">Edit</button><button class="btn sm alt" data-act="del" data-id="${p.id}">${armed===p.id?'Sure?':'Delete'}</button>`:''}</div></div></div>`}).join('')}</div>`:`<div class="empty">${owner?'No products yet — tap “Add product” below.':'New pieces coming soon 🎀'}</div>`}
 </main>
 <footer id="contact"><div class="serif" style="font-size:1.4rem">${esc(s.name)}</div><p>${ig?`<a href="https://instagram.com/${encodeURIComponent(ig)}" target="_blank" rel="noopener">Instagram</a>`:''}${wa?`<a href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a><a href="tel:+${wa}">Call</a>`:''}</p><small>© ${esc(s.name)}</small></footer>
 ${owner?`<div id="bar">${unlocked?`<button class="btn sm" data-act="add">+ Add product</button><button class="btn sm alt" data-act="cust">Customize</button>`:''}${unlocked||dirty()?`<button class="btn sm" data-act="pub" ${dirty()?'':'disabled'}>Publish changes</button>`:''}<button class="btn sm alt" data-act="lock">${unlocked?'🔒 Lock':'🔓 Unlock editing'}</button></div>`:''}${cn()?`<button id="cartb" class="btn" data-act="cart" style="bottom:${owner?84:20}px">🛍 Cart (${cn()})</button>`:''}`;
}
function modal(h){$('#modal').innerHTML=`<div class="ov" data-act="close"><div class="panel">${h}</div></div>`;}
const closeM=()=>$('#modal').innerHTML='';
function prodForm(p){p=p||{};tmpImg=p.img||'';
 modal(`<h2>${p.id?'Edit':'Add'} product</h2>
 <label>Name</label><input type="text" id="pn" value="${esc(p.name)}">
 <div class="two"><div><label>Price</label><input type="text" id="pp" inputmode="decimal" value="${esc(p.price)}"></div><div><label>Category</label><input type="text" id="pc" list="cl" value="${esc(p.cat)}"><datalist id="cl">${[...new Set(S.products.map(x=>x.cat).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div></div>
 <label>Description</label><textarea id="pd" rows="3">${esc(p.desc)}</textarea>
 <label>Photo</label><input type="file" id="pi" accept="image/*"><img class="pv" id="pv" ${tmpImg?`src="${tmpImg}"`:'hidden'} alt="">
 <label><input type="checkbox" id="ps" ${p.sold?'checked':''}> Mark as sold out</label>
 <div class="acts"><button class="btn alt sm" data-act="close">Cancel</button><button class="btn sm" data-act="saveP">Save</button></div>`);
 $('#pi').onchange=async e=>{const f=e.target.files[0];if(!f)return;tmpImg=await readImg(f);$('#pv').src=tmpImg;$('#pv').hidden=false;};}
function readImg(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82));};im.src=fr.result;};fr.readAsDataURL(f);});}
function custForm(){const s=S.store,t=S.theme;
 modal(`<h2>Customize</h2>
 <label>Colour themes</label><div class="pre">${PRE.map((p,i)=>`<div class="sw" title="${p[0]}" data-act="pre" data-id="${i}" style="background:linear-gradient(135deg,${p[3]} 50%,${p[4]} 50%)"></div>`).join('')}</div>
 <div class="cols"><label>Background</label><label>Card</label><input type="color" id="c-bg" value="${t.bg}"><input type="color" id="c-card" value="${t.card}"><label>Accent</label><label>Text &amp; buttons</label><input type="color" id="c-accent" value="${t.accent}"><input type="color" id="c-ink" value="${t.ink}"></div>
 <label>Shop name</label><input type="text" id="sn" value="${esc(s.name)}">
 <label>Tagline</label><input type="text" id="st" value="${esc(s.tagline)}">
 <div class="two"><div><label>Currency</label><input type="text" id="sc" value="${esc(s.currency)}"></div><div><label>Instagram handle</label><input type="text" id="si" value="${esc(s.insta)}"></div></div>
 <label>WhatsApp number (with country code, for orders)</label><input type="text" id="sw" inputmode="tel" value="${esc(s.whatsapp)}">
 <label>UPI ID (for payments)</label><input type="text" id="su" value="${esc(s.upi)}">
 <div class="acts"><button class="btn sm" data-act="saveC">Done</button></div>`);
 for(const k of ['bg','card','accent','ink'])$('#c-'+k).oninput=e=>{S.theme[k]=e.target.value;applyTheme();};}
function buildDoc(){const c=document.documentElement.cloneNode(true);
 c.querySelector('#root').innerHTML='';c.querySelector('#modal').innerHTML='';c.querySelector('#toast').removeAttribute('style');
 c.querySelector('#data').textContent=ser(S);c.removeAttribute('style');c.querySelector('body').removeAttribute('class');
 c.querySelectorAll('script:not([data-app]):not(#data):not(#logo)').forEach(x=>x.remove());
 return '<!DOCTYPE html>\n'+c.outerHTML;}
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id;
 if(a==='close'){if(e.target===t){closeM();if(dirty()||true)render();}return;}
 if(a==='filter'){filter=t.dataset.v;render();}
 else if(a==='add'&&edit())prodForm();
 else if(a==='edit'){editing=id;prodForm(S.products.find(p=>p.id===id));}
 else if(a==='del'){if(armed===id){S.products=S.products.filter(p=>p.id!==id);armed=null;}else{armed=id;setTimeout(()=>{if(armed===id){armed=null;render();}},3000);}render();}
 else if(a==='cpu'){navigator.clipboard&&navigator.clipboard.writeText(S.store.upi).then(()=>toast('UPI ID copied'),()=>toast(S.store.upi));}
 else if(a==='lock'){unlocked=!unlocked;armed=null;render();}
 else if(a==='addc'){cart[id]=(cart[id]||0)+1;svc();render();toast('Added to cart 🎀');}
 else if(a==='cart')cartForm();
 else if(a==='qp'){cart[id]++;svc();cartForm();}
 else if(a==='qm'){cart[id]--;if(cart[id]<=0)delete cart[id];svc();cartForm();}
 else if(a==='cust'&&edit())custForm();
 else if(a==='pre'){const p=PRE[id];S.theme={bg:p[1],card:p[2],accent:p[3],ink:p[4]};custForm();applyTheme();}
 else if(a==='saveP'){const name=$('#pn').value.trim();if(!name){toast('Please add a name');return;}
  const p={id:editing||'p'+Date.now(),name,price:$('#pp').value.trim(),cat:$('#pc').value.trim(),desc:$('#pd').value.trim(),img:tmpImg,sold:$('#ps').checked};
  const i=S.products.findIndex(x=>x.id===p.id);if(i>=0)S.products[i]=p;else S.products.unshift(p);editing=null;closeM();render();}
 else if(a==='saveC'){Object.assign(S.store,{name:$('#sn').value.trim()||'My Shop',tagline:$('#st').value.trim(),currency:$('#sc').value.trim(),insta:$('#si').value.trim(),whatsapp:$('#sw').value.trim(),upi:$('#su').value.trim()});closeM();render();}
 else if(a==='pub'){if(!artifact)return;t.disabled=true;t.textContent='Publishing…';
  try{await artifact.publish(buildDoc());}catch(err){toast(err&&err.code==='conflict'?'Another version was published — reloading':'Could not publish: '+((err&&(err.message||err.code))||'error'));t.disabled=false;t.textContent='Publish changes';}}
});
render();
(async()=>{try{if(!window.claude)return;const u=await claude.use('user');artifact=await claude.use('artifact');
 owner=!!(artifact&&u&&(await u.isOwner()));if(owner)render();}catch(e){}})();
</script>


</body></html>
