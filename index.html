<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clips.andties</title><style>body{font-family:Arial;margin:0;background:#fff7f4;color:#54312e}header{text-align:center;padding:24px;background:#fff;border-bottom:1px solid #ead8d2}.logo{font:700 38px Georgia;color:#b45f59}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ead8d2;border-radius:18px;padding:18px;margin-bottom:20px}label{display:block;font-weight:600;margin:12px 0 6px}input[type=text],input[type=number]{width:100%;padding:12px;border:1px solid #d8c2bc;border-radius:10px;box-sizing:border-box}.colors{display:flex;flex-wrap:wrap;gap:8px}.color{background:#fff3ef;padding:8px;border-radius:20px}.btn{margin-top:15px;padding:12px 16px;border:0;border-radius:10px;background:#b96b63;color:#fff;font-weight:bold}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.product{border:1px solid #ead8d2;border-radius:16px;overflow:hidden}.product img{width:100%;height:210px;object-fit:cover}.p{padding:14px}.price{font-size:20px;font-weight:bold}</style></head><body><header><div class="logo">Clips.andties</div></header><div class="wrap"><section class="card"><h2>➕ Add Product</h2><label>Product name</label><input id="name" type="text" placeholder="Example: Pearl Hair Clip"><label>Product photo</label><input id="photo" type="file" accept="image/*"><label>Price (₹)</label><input id="price" type="number" min="0" placeholder="99"><label>Colours</label><div class="colors"><label class="color"><input type="checkbox" value="Black"> Black</label><label class="color"><input type="checkbox" value="White"> White</label><label class="color"><input type="checkbox" value="Pink"> Pink</label><label class="color"><input type="checkbox" value="Brown"> Brown</label><label class="color"><input type="checkbox" value="Red"> Red</label><label class="color"><input type="checkbox" value="Blue"> Blue</label></div><button class="btn" onclick="add()">Add Product</button></section><section class="card"><h2>🛍️ Products</h2><div id="list"></div></section></div><script>let ps=JSON.parse(localStorage.getItem('cat')||'[]');function render(){let l=document.getElementById('list');if(!ps.length){l.innerHTML='<p>No products added yet.</p>';return}l.innerHTML='<div class="products">'+ps.map((p,i)=>'<div class="product"><img src="'+p.img+'"><div class="p"><h3>'+p.name+'</h3><div class="price">₹'+p.price+'</div><p>Colours: '+(p.c||'Not specified')+'</p><button class="btn" onclick="share('+i+')">Share on WhatsApp</button></div></div>').join('')+'</div>'}function add(){let n=document.getElementById('name').value.trim(),pr=document.getElementById('price').value,f=document.getElementById('photo').files[0],c=[...document.querySelectorAll('.color input:checked')].map(x=>x.value).join(', ');if(!n||!pr||!f){alert('Enter name, photo and price');return}let r=new FileReader();r.onload=()=>{ps.push({name:n,price:pr,c,img:r.result});localStorage.setItem('cat',JSON.stringify(ps));document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('photo').value='';render()};r.readAsDataURL(f)}function share(i){let p=ps[i],t=p.name+'\nPrice: ₹'+p.price+'\nColours: '+(p.c||'Available')+'\n\nClips.andties';location.href='https://wa.me/?text='+encodeURIComponent(t)}render();</script></body></html>
